name: bine-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-cpu-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (CPU-only)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBINE_CPU_ONLY=ON -DBINE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        run: .\build\Release\bine_tests.exe

  build-gpu-linux:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.2.1-devel-ubuntu24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build git

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CUDA_ARCHITECTURES=120

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ./build/bine_tests
